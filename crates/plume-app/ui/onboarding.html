<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plume</title>
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/shell.css" />
    <script type="module" src="./js/onboarding.js"></script>
  </head>
  <body>
    <main class="onboarding">
      <img class="onboarding-tile" src="./assets/app-icon.png" alt="" width="88" height="88" />
      <h1 class="onboarding-title" data-i18n="welcome_to_plume">Welcome to Plume</h1>
      <p class="onboarding-subtitle" data-i18n="voice_dictation_in_every_app">
        Voice dictation, in every app.
      </p>
      <div class="onboarding-content"></div>
      <footer class="onboarding-footer">
        <button type="button" class="button-plain" id="skip" data-i18n="skip">Skip</button>
        <button type="button" class="button-prominent" id="continue" data-i18n="continue">
          Continue
        </button>
      </footer>
    </main>
  </body>
</html>
