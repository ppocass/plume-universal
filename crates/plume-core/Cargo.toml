[package]
name = "plume-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Le cœur de Plume, sans interface : audio, barrière anti-silence, moteur, texte, touche, collage.
# Chaque bras n'ajoute ici QUE les dépendances de son module, dans sa section.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
# --- audio (micro, WAV) ---
hound = "3.5"
# --- engine ---
# --- text ---
regex = "1"
# --- input (touche, collage) ---
