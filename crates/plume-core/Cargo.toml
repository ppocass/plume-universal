[package]
name = "plume-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Le cœur de Plume, sans interface : audio, barrière anti-silence, moteur, texte, touche, collage.
# Chaque bras n'ajoute ici QUE les dépendances de son module, dans sa section.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
# --- audio (micro, WAV) ---
hound = "3.5"
# --- engine ---
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }
# --- text ---
regex = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
# --- input (touche, collage) ---
cpal = "0.15"
arboard = "3"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
# --- store ---
# Dossiers XDG / APPDATA (dirs), dates ISO 8601 des fichiers JSON (chrono),
# identifiants des dictées (uuid) — les mêmes formats que l'app macOS.
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Windows : le Ctrl+V du collage (SendInput). Rien à compiler sous Linux.
[target.'cfg(windows)'.dependencies]
enigo = "0.6"
# --- controller ---

# Tests : un dossier de données temporaire, posé dans PLUME_DATA_DIR.
[dev-dependencies]
# --- store ---
tempfile = "3"

